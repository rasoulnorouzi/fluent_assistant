name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # only used to attach the APK to a GitHub Release on v* tags

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --console=plain

      # Signed with YOUR key from repo secrets (see README "Signing"). Skipped until the secrets exist.
      - name: Signed release APK
        env:
          TF_KEYSTORE_BASE64: ${{ secrets.TF_KEYSTORE_BASE64 }}
          TF_KEYSTORE_PASSWORD: ${{ secrets.TF_KEYSTORE_PASSWORD }}
          TF_KEY_ALIAS: ${{ secrets.TF_KEY_ALIAS }}
          TF_KEY_PASSWORD: ${{ secrets.TF_KEY_PASSWORD }}
        run: |
          if [ -z "$TF_KEYSTORE_BASE64" ]; then
            echo "::notice::No signing secrets yet, so no release APK. Install the debug APK, or add the secrets (README → Signing)."
            exit 0
          fi
          echo "$TF_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          TF_KEYSTORE_FILE="$RUNNER_TEMP/release.jks" ./gradlew assembleRelease --console=plain
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: tone-fixer-apk
          path: |
            android/build/outputs/apk/release/*.apk
            android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
