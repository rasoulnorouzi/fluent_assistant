<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tone Fixer</title>
<style>
  @font-face { font-family: "Fraunces Title"; src: url("fraunces_title.ttf") format("truetype"); }
  :root { --bg:#F3F0E8; --card:#FBF8F1; --ink:#2B2A26; --muted:#6B675E; --line:#CFC8B8; --primary:#4F6B55;
          --on-primary:#FBF8F1; --warn:#A35A3A; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1F2320; --card:#2A302B; --ink:#ECE7DA; --muted:#A9A397; --line:#4A524B; --primary:#9BBBA2;
            --on-primary:#1F2320; --warn:#E7A285; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 290px; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { padding: 14px; display: grid; gap: 10px; }
  header { display: flex; align-items: center; gap: 8px; }
  header img { width: 26px; height: 26px; }
  h1 { margin: 0; font: 600 20px/1 "Fraunces Title", Georgia, serif; flex: 1; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .card { background: var(--card); border-radius: 16px; padding: 4px 12px; }
  .line { display: flex; align-items: center; gap: 10px; min-height: 46px; }
  .line + .line { border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
  .line span { flex: 1; }
  .line small { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 190px; }
  .sw { width: 42px; height: 24px; border-radius: 12px; background: var(--line); position: relative; flex: none; transition: background .15s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--card); transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .sw[aria-checked="true"] { background: var(--primary); }
  .sw[aria-checked="true"]::after { left: 21px; }
  .sw:disabled { opacity: .4; cursor: default; }
  .seg { display: flex; gap: 3px; padding: 3px; border-radius: 12px; background: var(--line); }
  .seg button { height: 28px; padding: 0 10px; border-radius: 9px; font-size: 13px; }
  .seg button.sel { background: var(--primary); color: var(--on-primary); font-weight: 700; }
  .big { width: 100%; height: 44px; border-radius: 14px; background: var(--primary); color: var(--on-primary); font-weight: 700; font-size: 15px; }
  .big:disabled { opacity: .45; cursor: default; }
  .note { margin: 0; font-size: 12px; color: var(--muted); }
  .note.err { color: var(--warn); }
  .links { display: flex; justify-content: space-between; font-size: 13px; }
  .links button { color: var(--primary); text-decoration: underline; }
  .new { color: var(--warn) !important; font-weight: 700; }
</style>
</head>
<body>
<main>
  <header><img src="icons/48.png" alt=""><h1>Tone Fixer</h1></header>
  <div class="card">
    <div class="line"><span>On</span><button class="sw" id="enabled" role="switch" aria-label="Tone Fixer on"></button></div>
    <div class="line"><span>On this site<small id="site"></small></span><button class="sw" id="here" role="switch" aria-label="On this site"></button></div>
    <div class="line"><span>Bubble</span><div class="seg" id="spot"><button data-v="corner">Corner</button><button data-v="box">By the box</button></div></div>
  </div>
  <button class="big" id="page" dir="rtl">ترجمه‌ی این صفحه به فارسی</button>
  <p class="note" id="note" dir="rtl">ترجمه‌ی متن انتخاب‌شده: کلیک راست ← «ترجمه به فارسی»</p>
  <div class="links"><button id="settings">Settings (key, model)</button><button id="update" hidden class="new">New version</button></div>
</main>
<script src="popup.js" type="module"></script>
</body>
</html>
